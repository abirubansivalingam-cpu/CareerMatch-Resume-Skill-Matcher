{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card p-4 p-lg-5"><h2 class="fw-bold">Welcome back</h2><p class="muted">Sign in to continue.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autocomplete="username"></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div><button class="btn btn-primary w-100">Log in</button></form><p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p></div></div></div>{% endblock %}
